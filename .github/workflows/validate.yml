name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, not floating: this package's claim is that it passes the conformance
      # suite of a named specification release. Tracking the default branch would mean
      # a green run said only that it agreed with whatever landed there this morning.
      # Bump deliberately when adopting a new release.
      - uses: actions/checkout@v4
        with:
          repository: OO-LD/oold-schema
          ref: v1.0.0-rc.5
          path: oold-schema
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # The corpus and the meta-schemas both come from oold-schema: this package validates that
      # specification and vendors nothing from it, so a run needs a checkout of it to mean anything.
      - run: node src/validate.mjs oold-schema/examples --meta oold-schema/meta
